name: Stocks regime alert
on:
  workflow_dispatch:
  schedule:
    - cron: "35 21 * * 1-5"
concurrency:
  group: stocksregime
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  stocks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python stocks_regime_alert.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save results
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add stocks_state.json stocks_report.txt stocks_log.csv stocks_start.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Stocks regime update" && (git pull --rebase -q; git push))
