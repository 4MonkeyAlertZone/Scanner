name: Alt regime alert
on:
  workflow_dispatch:
  schedule:
    - cron: "50 0 * * *"
permissions:
  contents: write
concurrency:
  group: regimealert
  cancel-in-progress: false
jobs:
  regime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python regime_alert.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
                      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
             TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add regime_state.json regime_log.csv regime_report.txt basketgate_oi.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Regime update" && (git pull --rebase -q; git push))
