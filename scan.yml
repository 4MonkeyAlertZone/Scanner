name: Support scan
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: scan
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            alerts.json
            lists.json
            trend_state.json
          key: alerts-${{ github.run_id }}
          restore-keys: alerts-
      - run: python tracker.py
        env:
          TOKENS: "TOP100,SP500"
          CHECK_EVERY_MINUTES: "0"
          MIN_SCORE: "3"
          MIN_RR: "1.2"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC_STOCKS: ${{ secrets.NTFY_TOPIC_STOCKS }}
          HOLDINGS: ${{ secrets.HOLDINGS }}
          SHORT_TOKENS: ""   # short alerts switched off: they lost money in the real-data backtest
          SUMMARY_HOUR_UTC: "7"
      - name: Save signal log
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add signals.csv paper_trades.csv daily_report.md summary_state.json trend_state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update signal log" && (git pull --rebase -q; git push))
