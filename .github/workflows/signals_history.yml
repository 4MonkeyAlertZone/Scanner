name: Signal history replay
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python signals_history.py
      - name: Save results
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add signals_history.csv signals_history.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Signal history" && (git pull --rebase -q; git push))
