name: What-if report
on:
  workflow_dispatch:
    inputs:
      since:
        description: "Count paper BUY SIGNALs opened since (UTC, YYYY-MM-DDTHH:MM)"
        default: "2026-10-16T15:30"
      amount:
        description: "Dollars per signal"
        default: "1000"
      verdict:
        description: "Which signals: BUY SIGNAL, IN ZONE, RECLAIM A, RECLAIM C, CROSS C ..."
        default: "BUY SIGNAL"
permissions:
  contents: write
jobs:
  mark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python mark.py
        env:
          SINCE: ${{ inputs.since }}
          AMOUNT: ${{ inputs.amount }}
          VERDICT: ${{ inputs.verdict }}
      - name: Save report
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add mark_report.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "What-if report" && (git pull --rebase -q; git push))
