name: ETF forward paper track
on:
  schedule:
    - cron: "41 10 * * *"
  workflow_dispatch:
concurrency:
  group: etf_paper
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  etf_paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python etf_flows.py && python etf_paper.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save results
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add etf_flows.csv etf_paper_state.json etf_paper_log.csv etf_paper_report.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "ETF forward paper track" && (git pull --rebase -q; git push))
