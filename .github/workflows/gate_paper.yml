name: Gate paper bot
on:
  workflow_dispatch:
  schedule:
    - cron: "25 1 * * *"
permissions:
  contents: write
concurrency:
  group: gatepaper
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python gate_paper.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add gate_paper_state.json gate_paper_log.csv gate_paper_report.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Gate paper bot update" && (git pull --rebase -q; git push))
