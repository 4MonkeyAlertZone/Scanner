name: OKX liquidation collector
on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
  push:
    paths:
      - ".github/workflows/okx_liq.yml"
      - "okx_liq.py"
concurrency:
  group: okxliq
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python okx_liq.py
      - name: Save results
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add okx_liq_*.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "OKX liquidations" && (git pull --rebase -q; git push))
