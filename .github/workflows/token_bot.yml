name: token_bot
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
concurrency:
  group: tgbot
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check for new messages
        id: chk
        run: python token_bot.py --check
      - name: Install charting library
        if: steps.chk.outputs.pending == 'true'
        run: pip install matplotlib
      - name: Reply
        if: steps.chk.outputs.pending == 'true'
        run: python token_bot.py
