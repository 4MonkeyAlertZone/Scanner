name: Strategy lab 10
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/lab10.yml"
      - "backtest_lab10.py"
concurrency:
  group: lab10
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  lab10:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python backtest_lab10.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save results
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add lab10_summary.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Strategy lab 10 results" && (git pull --rebase -q; git push))
