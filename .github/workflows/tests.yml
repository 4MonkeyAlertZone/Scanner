name: Unit tests
on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - "scanner.py"
      - "tests/**"
      - ".github/workflows/tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover tests -v
