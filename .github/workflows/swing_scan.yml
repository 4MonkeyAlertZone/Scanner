name: Swing scanner
on:
  workflow_dispatch:
  schedule:
    - cron: "12 1 * * *"
permissions:
  contents: write
concurrency:
  group: swingscan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python swing_scan.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add swing_state.json swing_report.txt swing_log.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Swing scanner update" && (git pull --rebase -q; git push))
