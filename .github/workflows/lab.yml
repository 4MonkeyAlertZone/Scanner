name: Strategy lab
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/lab.yml"
      - "backtest_lab.py"
concurrency:
  group: lab
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python backtest_lab.py
        env:
          LAB_CRYPTO: "30"
          LAB_STOCKS: "30"
          LAB_MONTHS: "24"
          LAB_STOCK_YEARS: "5"
          MIN_SCORE: "3"
          MIN_RR: "1.2"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save results
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add lab_summary.txt lab_results.csv lab_candidates.csv.gz 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Strategy lab results" && (git pull --rebase -q; git push))
