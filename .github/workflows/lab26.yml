name: Strategy lab 26
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/lab26.yml"
      - "backtest_lab26.py"
concurrency:
  group: lab26
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  lab26:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python backtest_lab26.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save results
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add lab26_summary.txt btc_metrics_daily.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Strategy lab 26 results" && (git pull --rebase -q; git push))
