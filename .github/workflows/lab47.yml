name: Strategy lab 47
on:
  workflow_dispatch:
concurrency:
  group: lab47
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  lab47:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python etf_flows.py && python backtest_lab47.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save results
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add lab47_summary.txt etf_flows.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Strategy lab 47 results" && (for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep 8; done))
