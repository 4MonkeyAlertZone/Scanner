name: Strategy lab 8
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/lab8.yml"
      - "backtest_lab8.py"
concurrency:
  group: lab8
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  lab8:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python backtest_lab8.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save results
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add lab8_summary.txt lab8_results.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Strategy lab 8 results" && (git pull --rebase -q; git push))
