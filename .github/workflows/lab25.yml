name: Strategy lab 25
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/lab25.yml"
      - "backtest_lab25.py"
concurrency:
  group: lab25
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  lab25:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scikit-learn
      - run: python backtest_lab25.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save results
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add lab25_summary.txt  2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Strategy lab 25 results" && (git pull --rebase -q; git push))
