name: Strategy lab 3
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/lab3.yml"
      - "backtest_lab3.py"
concurrency:
  group: lab3
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  lab3:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python backtest_lab3.py
        env:
          LAB3_COINS: "60"
          LAB3_MONTHS: "36"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save results
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add lab3_summary.txt lab3_results.csv lab3_candidates.csv.gz 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Strategy lab 3 results" && (git pull --rebase -q; git push))
