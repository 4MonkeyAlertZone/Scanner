name: Strategy labs 12+14 low fee
on:
  workflow_dispatch:
concurrency:
  group: labfee
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  fee:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python backtest_lab12.py
        env:
          LAB_COST: "0.001"
          LAB_TAG: "_fee01"
          LAB7_TOTAL: "100"
          LAB6_MONTHS: "84"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: python backtest_lab14.py
        env:
          LAB_COST: "0.001"
          LAB_TAG: "_fee01"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save results
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add lab12_fee01_summary.txt lab12_fee01_results.csv lab14_fee01_summary.txt lab14_fee01_results.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Low-fee reruns of labs 12 and 14" && (git pull --rebase -q; git push))
