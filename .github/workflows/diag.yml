name: Data check
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diag.yml"
      - "diag.py"
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python diag.py
      - name: Save results
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add diag_output.txt
          git diff --cached --quiet || (git commit -m "Data check results" && (git pull --rebase -q; git push))
