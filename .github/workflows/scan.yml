name: Support scan
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            alerts.json
            lists.json
          key: alerts-${{ github.run_id }}
          restore-keys: alerts-
      - run: python scanner.py
        env:
          TOKENS: "TOP100,SP500"
          CHECK_EVERY_MINUTES: "0"
          MIN_SCORE: "3"
          MIN_RR: "1.2"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOPIC_STOCKS: ${{ secrets.NTFY_TOPIC_STOCKS }}
