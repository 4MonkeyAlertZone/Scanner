name: Strategy lab 6
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/lab6.yml"
      - "backtest_lab6.py"
concurrency:
  group: lab6
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  lab6:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python backtest_lab6.py
        env:
          LAB6_COINS: "60"
          LAB6_MONTHS: "36"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save results
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add lab6_summary.txt lab6_results.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Strategy lab 6 results" && (git pull --rebase -q; git push))
