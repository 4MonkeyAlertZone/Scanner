name: Strategy lab 13
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/lab13.yml"
      - "backtest_lab13.py"
concurrency:
  group: lab13
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  lab13:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python backtest_lab13.py
        env:
          LAB7_TOTAL: "100"
          LAB6_MONTHS: "84"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save results
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add lab13_summary.txt lab13_results.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Strategy lab 13 results" && (git pull --rebase -q; git push))
