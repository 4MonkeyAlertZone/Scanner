name: Strategy lab 5
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/lab5.yml"
      - "backtest_lab5.py"
concurrency:
  group: lab5
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  lab5:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python backtest_lab5.py
        env:
          LAB5_COINS: "60"
          LAB5_HOURS: "26500"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save results
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add lab5_summary.txt lab5_results.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Strategy lab 5 results" && (git pull --rebase -q; git push))
