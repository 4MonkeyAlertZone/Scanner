name: Strategy lab 24
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/lab24.yml"
      - "backtest_lab24.py"
concurrency:
  group: lab24
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  lab24:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scikit-learn
      - run: python backtest_lab24.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save results
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add lab24_summary.txt  2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Strategy lab 24 results" && (git pull --rebase -q; git push))
