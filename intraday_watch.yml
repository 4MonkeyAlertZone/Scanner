name: Intraday warning watch
on:
  workflow_dispatch:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
permissions:
  contents: write
concurrency:
  group: intradaywatch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python intraday_watch.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add intraday_state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Intraday warning sent" && (git pull --rebase -q; git push))
